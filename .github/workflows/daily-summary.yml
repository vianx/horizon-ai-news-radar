name: Daily Horizon Summary

on:
  schedule:
    # GitHub cron uses UTC. These retries run during 07:00-08:59 Asia/Shanghai, before DeepSeek peak pricing.
    - cron: '7 23 * * *'
    - cron: '17 23 * * *'
    - cron: '27 23 * * *'
    - cron: '37 23 * * *'
    - cron: '47 23 * * *'
    - cron: '7 0 * * *'
    - cron: '17 0 * * *'
    - cron: '27 0 * * *'
    - cron: '37 0 * * *'
    - cron: '47 0 * * *'
  workflow_dispatch:

concurrency:
  group: horizon-daily-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check whether today's summary already exists
        id: check_existing
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bj_hour="$(TZ=Asia/Shanghai date +'%H')"
          if [ "$bj_hour" != "07" ] && [ "$bj_hour" != "08" ]; then
            echo "Scheduled run started outside 07:00-08:59 Asia/Shanghai (hour=${bj_hour}). Skipping to avoid DeepSeek peak pricing."
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          today="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          git fetch origin gh-pages --depth=1 || true
          if git cat-file -e "origin/gh-pages:_posts/${today}-summary-zh.md" 2>/dev/null; then
            echo "Today's summary already exists: ${today}. Skipping scheduled duplicate run."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No summary found for ${today}. Running Horizon."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_existing.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: steps.check_existing.outputs.exists != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        if: steps.check_existing.outputs.exists != 'true'
        run: uv sync

      - name: Prepare GitHub Actions config
        if: steps.check_existing.outputs.exists != 'true'
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        if: steps.check_existing.outputs.exists != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run horizon --hours 24

      - name: Upload generated summaries
        if: always() && steps.check_existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: horizon-summaries
          path: |
            data/summaries/*.md
            docs/_posts/*.md
          if-no-files-found: warn

      - name: Publish summaries to GitHub Pages branch
        if: success() && steps.check_existing.outputs.exists != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true